[package]
name = "pyocrust_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Native Rust core of pyocrust: OCR and document structure analysis over oar-ocr."

[lib]
name = "pyocrust_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 con abi3-py310 (PEP 384): el binario sirve para CPython >= 3.10.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }

# Backend OCR. ADR-010: por defecto `simd` + `auto-download` (descarga de modelos
# registrados desde ModelScope hacia $OAR_HOME, DESIGN.md §3.2). `cuda`/`directml`
# quedan como features opcionales de este crate.
oar-ocr = { version = "0.10.1", features = ["simd", "auto-download"] }

# Motor VLM opcional (Candle). ADR-001: es un crate **distinto** de `oar-ocr`
# (`oar-ocr` es ONNX Runtime; este no enlaza ORT nunca) y queda **fuera del build
# por defecto** bajo la feature `vl` (tarjeta 01). Sus features `cuda`/`metal`
# no se activan aquí; el dispositivo lo elige el wrapper en runtime (tarjeta 02).
oar-ocr-vl = { version = "0.10.2", optional = true }

# Tipos de imagen compartidos con el preprocesamiento nativo (ADR-009, tarjeta I2).
image = "0.25"

# Paralelismo solo para preprocesamiento intensivo de CPU (ADR-008).
rayon = "1.8"

# Descargador Hugging Face resiliente (ADR-007, tarjeta I3).
# rustls evita depender del OpenSSL del sistema en Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "rustls-tls"] }
sha2 = "0.10"

[features]
# GPU: se activa compilando con --features cuda (NVIDIA), --features directml
# (Windows) o --features coreml (macOS / Apple Silicon) (ADR-010).
cuda = ["oar-ocr/cuda"]
directml = ["oar-ocr/directml"]
coreml = ["oar-ocr/coreml"]

# VLM (Candle / `oar-ocr-vl`): opt-in, **nunca** por defecto (ADR-001). No añade
# dependencias de Python (todo es Rust): lo que crece es el `.pyd`, no el
# `pip install`. Los pesos se descargan en runtime, no viajan en el wheel.
#
# `oar-ocr-vl/auto-download` (ureq + sha2 + dirs) es lo que resuelve y baja los
# snapshots bajo `$OAR_HOME/models/<org>/<name>/<commit>`; el wrapper reexporta
# su root resuelto como `OAR_HOME`, así que caen bajo el root del wrapper.
vl = ["dep:oar-ocr-vl", "oar-ocr-vl/auto-download"]

# VLM sobre GPU (Candle CUDA). Añade `candle-flash-attn`, que compila kernels
# con `nvcc` (CUDA Toolkit completo): build largo y específico de GPU. Es la
# única vía de `device="cuda"` para el preset VLM; sin esta feature, pedirlo da
# un error tipado (nunca CPU etiquetado como CUDA).
vl-cuda = ["vl", "oar-ocr-vl/cuda"]

# Parche local de `ort-sys` 2.0.0-rc.13 (misma version, ver `vendor/ort-sys/`):
# oar-ocr 0.10.x fija `ort = "=2.0.0-rc.13"` (ORT 1.28), cuyo provider CUDA no
# trae kernels sm_120 y en Blackwell (RTX PRO 4000, compute 12.0) falla con
# cudaErrorNoKernelImageForDevice. El parche de sm_120 toca solo
# `build/download/dist.tsv` y apunta los dists CUDA (`cuda13,tensorrt,nvrtx[,directml]`) de Windows y Linux
# al binario oficial `ms@1.31.0` de pyke (ORT 1.31, si trae sm_120/sm_120a); el
# resto de filas sigue en ms@1.28.0. La API C de ORT es append-only, asi que los
# bindings de rc.13 (api-27) enlazan contra la lib 1.31.
[patch.crates-io]
ort-sys = { path = "vendor/ort-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# ADR-004 / ADR-010: con `unwind` un pánico de Rust se traduce a PyErr y no
# abate el proceso Python. Prohibido `panic = "abort"` (ver xycutppy/Cargo.toml:33).
panic = "unwind"
