name: Publish pyocrust-gpu to PyPI

# Paquete acelerado por GPU: mismo código que `pyocrust`, compilado con la
# feature `cuda` de oar-ocr y publicado bajo OTRO proyecto de PyPI
# (`pyocrust-gpu`), igual que `onnxruntime` vs `onnxruntime-gpu`.
#
# El paquete Python sigue importándose como `pyocrust` (no `pyocrust_gpu`):
# `pyocrust-gpu` y `pyocrust` **no** deben instalarse a la vez (comparten el
# módulo nativo `pyocrust._pyocrust_core`).
#
# La publicación la gestiona un trusted publisher y un environment distintos:
#   - proyecto PyPI:  pyocrust-gpu
#   - environment:    pypi-gpu
on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.job.os }} | ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # El acelerador depende de la plataforma (mismo wheel `pyocrust-gpu`):
        #   - Linux x86_64 / Windows x86_64 -> CUDA (`--features cuda`), ORT GPU.
        #   - macOS aarch64 (Apple Silicon) -> CoreML (`--features coreml`); no
        #     existe CUDA en Apple, CoreML usa el Neural Engine/GPU vía Metal.
        #   - Linux aarch64 FUERA: `ort-sys` (build/download/dist.tsv) no publica
        #     un dist CUDA para `aarch64-unknown-linux-gnu` (solo `none`), y
        #     `resolve_dist()` aborta el build si el dist no cubre `cuda`.
        # abi3-py310 -> un único wheel por plataforma cubre CPython 3.10-3.14.
        job:
          # --- LINUX / WINDOWS: CUDA ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
            features: cuda
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64
            features: cuda

          # --- macOS: CoreML ---
          - os: macos-26
            target: aarch64-apple-darwin
            python-architecture: arm64
            features: coreml

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        architecture: ${{ matrix.job.python-architecture }}

    # Renombra el proyecto para publicar el wheel GPU bajo `pyocrust-gpu` sin
    # tocar el código fuente. `shell: python` es portable (Windows/macOS/Linux).
    - name: Patch metadata for GPU package
      shell: python
      run: |
        from pathlib import Path

        pyproject = Path("pyproject.toml")
        pyproject.write_text(
            pyproject.read_text(encoding="utf-8")
            .replace('name = "pyocrust"', 'name = "pyocrust-gpu"'),
            encoding="utf-8",
        )

    - name: Build wheel with Maturin (Ubuntu alias)
      if: startsWith(matrix.job.os, 'ubuntu')
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        # La feature la fija la matriz: `cuda` (Linux/Windows) o `coreml` (macOS).
        args: --release --features ${{ matrix.job.features }} --out dist --interpreter "python3.10"
        manylinux: "2_28"
        # Ver ci-cd.yml: hace falta openssl.pc para el build script de ort-sys, y
        # no es el mismo paquete en los dos contenedores Linux.
        before-script-linux: |
          if command -v yum &>/dev/null; then yum install -y openssl-devel
          else apt-get update && apt-get install -y pkg-config libssl-dev; fi
          # ring 0.17.14 no compila su asm ARM pregenerado con el cross-gcc del
          # contenedor: pregenerated/chacha-armv8-linux64.S -> asm_base.h
          # "ARM assembler must define __ARM_ARCH" (macro ACLE, GCC 4.8+; el
          # preprocesado de un .S no lo recibe). cc-rs lee CFLAGS_<target> y el
          # prefijo CFLAGS_ está en ALLOWED_ENV_PREFIXES de maturin-action, así que
          # el `export` del before-script llega a maturin. Nulo en los builds nativos
          # (x86_64 lee CFLAGS_x86_64-unknown-linux-gnu / HOST_CFLAGS).
          export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"

    - name: Build wheel with Maturin (non-Ubuntu path)
      if: ${{ !startsWith(matrix.job.os, 'ubuntu') }}
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        args: --release --features ${{ matrix.job.features }} --out dist --interpreter "${{ steps.setup-python.outputs.python-path }}"
        manylinux: auto

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions-gpu-${{ matrix.job.os }}-${{ matrix.job.target }}
        path: dist/*.whl

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-gpu
      url: https://pypi.org/p/pyocrust-gpu

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-gpu-*
        path: artifacts/

    - name: Validate and collect wheels
      shell: python
      run: |
        import shutil
        import zipfile
        from pathlib import Path

        artifacts = Path("artifacts")
        dist = Path("dist")
        dist.mkdir(parents=True, exist_ok=True)

        wheels = sorted(artifacts.rglob("*.whl"))
        if not wheels:
          raise SystemExit("No wheels found under artifacts/")

        def assert_no_trailing_data(path: Path) -> None:
          data = path.read_bytes()
          sig = b"PK\x05\x06"  # End of central directory signature
          eocd = data.rfind(sig)
          if eocd < 0:
            raise SystemExit(f"Invalid wheel (missing EOCD): {path}")
          if eocd + 22 > len(data):
            raise SystemExit(f"Invalid wheel (truncated EOCD): {path}")
          comment_len = int.from_bytes(data[eocd + 20:eocd + 22], "little")
          expected_end = eocd + 22 + comment_len
          if expected_end != len(data):
            raise SystemExit(f"Invalid wheel (trailing data): {path}")

        valid_wheels = []
        for wheel in wheels:
          out = dist / wheel.name
          if out.exists():
            print(f"Skipping duplicate wheel filename: {wheel.name}")
            continue
          with zipfile.ZipFile(wheel, "r") as zf:
            if zf.testzip() is not None:
              raise SystemExit(f"Corrupted wheel archive: {wheel}")
          assert_no_trailing_data(wheel)
          shutil.copy2(wheel, out)
          valid_wheels.append(out.name)

        if not valid_wheels:
          raise SystemExit("No valid wheels to publish after validation.")

        print("Valid wheels to publish:")
        for name in valid_wheels:
          print(f" - {name}")

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        skip-existing: true
