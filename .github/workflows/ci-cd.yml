name: Publish pyocrust to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.job.os }} | ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyocrust compila pyo3 con `abi3-py310` (PEP 384): un único wheel por
        # plataforma sirve para CPython 3.10-3.14, así que no se repite el build
        # una vez por versión de Python como en xycutppy; se usa el intérprete
        # mínimo soportado (3.10).
        #
        # Plateado soportado = el que tiene binarios de ONNX Runtime publicados por
        # `ort`. oar-ocr se compila con su feature por defecto `download-binaries`,
        # y el catálogo de ort-sys 2.0.0-rc.13 (`build/download/dist.tsv`) solo
        # cubre x86_64/aarch64 en Linux, x86_64/aarch64 en Windows y
        # aarch64-apple-darwin en macOS. Sobran por tanto:
        #   - i686-pc-windows-msvc  (Windows x86)
        #   - x86_64-apple-darwin   (macOS Intel)
        # Añadirlos solo produciría dos jobs en rojo.
        job:
          # --- LINUX ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            python-architecture: x64

          # --- WINDOWS ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64

          # --- macOS ---
          - os: macos-26  # Arquitectura Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            python-architecture: arm64

    steps:
    # Usamos las versiones estables más recientes de las actions
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        architecture: ${{ matrix.job.python-architecture }}

    - name: Build wheel with Maturin (Ubuntu alias)
      if: startsWith(matrix.job.os, 'ubuntu')
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        args: --release --out dist --interpreter "python3.10"
        manylinux: auto
        # oar-ocr (feature por defecto `download-binaries`) activa ort/tls-native ->
        # ort-sys/tls-native -> ureq?/native-tls -> native-tls -> openssl-sys. En Linux
        # openssl-sys sólo hace falta para el *build script* de ort-sys (es
        # build-dependency del host: `cargo tree --edges normal -i openssl-sys` sale
        # vacío), así que no acaba en el wheel, pero necesita openssl.pc.
        # Los dos contenedores de Linux no traen lo mismo, y el script corre bajo
        # `set -euo pipefail` (una rama inexistente aborta el job, no lo salta):
        #   x86_64  -> quay.io/pypa/manylinux2014_x86_64 (CentOS 7): manylinux sólo
        #              instala la lib `openssl` de runtime, no `openssl-devel`
        #              (MANYLINUX_DEPS en pypa/manylinux) -> yum.
        #   aarch64 -> ghcr.io/rust-cross/manylinux2014-cross:aarch64 (Ubuntu 22.04):
        #              sin yum ni pkg-config -> apt instala pkg-config + libssl-dev.
        before-script-linux: |
          if command -v yum &>/dev/null; then yum install -y openssl-devel
          else apt-get update && apt-get install -y pkg-config libssl-dev; fi

    - name: Build wheel with Maturin (non-Ubuntu path)
      if: ${{ !startsWith(matrix.job.os, 'ubuntu') }}
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.job.target }}
        args: --release --out dist --interpreter "${{ steps.setup-python.outputs.python-path }}"
        manylinux: auto

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions-${{ matrix.job.os }}-${{ matrix.job.target }}
        path: dist/*.whl

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyocrust

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        pattern: python-package-distributions-*
        path: artifacts/

    - name: Validate and collect wheels
      shell: python
      run: |
        import shutil
        import zipfile
        from pathlib import Path

        artifacts = Path("artifacts")
        dist = Path("dist")
        dist.mkdir(parents=True, exist_ok=True)

        wheels = sorted(artifacts.rglob("*.whl"))
        if not wheels:
          raise SystemExit("No wheels found under artifacts/")

        def assert_no_trailing_data(path: Path) -> None:
          data = path.read_bytes()
          sig = b"PK\x05\x06"  # End of central directory signature
          eocd = data.rfind(sig)
          if eocd < 0:
            raise SystemExit(f"Invalid wheel (missing EOCD): {path}")
          if eocd + 22 > len(data):
            raise SystemExit(f"Invalid wheel (truncated EOCD): {path}")
          comment_len = int.from_bytes(data[eocd + 20:eocd + 22], "little")
          expected_end = eocd + 22 + comment_len
          if expected_end != len(data):
            raise SystemExit(f"Invalid wheel (trailing data): {path}")

        valid_wheels = []
        for wheel in wheels:
          out = dist / wheel.name
          if out.exists():
            print(f"Skipping duplicate wheel filename: {wheel.name}")
            continue
          with zipfile.ZipFile(wheel, "r") as zf:
            if zf.testzip() is not None:
              raise SystemExit(f"Corrupted wheel archive: {wheel}")
          assert_no_trailing_data(wheel)
          shutil.copy2(wheel, out)
          valid_wheels.append(out.name)

        if not valid_wheels:
          raise SystemExit("No valid wheels to publish after validation.")

        print("Valid wheels to publish:")
        for name in valid_wheels:
          print(f" - {name}")

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        skip-existing: true
